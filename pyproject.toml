[project]
name = "artifact-rot"
version = "0.1.0"
description = "Observatory of research artifact survival: measures whether code and data links announced in scientific papers still resolve."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "lifelines>=0.28",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "statsmodels>=0.14",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-httpx>=0.30", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artifact_rot"]

[tool.hatch.build.targets.wheel.force-include]
"artifact_rot/data/tlds.txt" = "artifact_rot/data/tlds.txt"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: touches the real network (E2 control set); disabled by default",
]
addopts = "-m 'not network'"
