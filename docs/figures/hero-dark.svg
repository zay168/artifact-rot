<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="artifact-rot — an observatory of research-link survival"><title>artifact-rot — an observatory of research-link survival</title><style>@font-face{font-family:'AR Display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AR Sans';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AR Sans Bold';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="100%" height="100%" fill="#0B0B0B"/><line x1="56.0" y1="56.0" x2="1144.0" y2="56.0" stroke="#FFFFFF" stroke-width="2"/><text x="56.0" y="86.0" font-family="AR Sans Bold" font-size="13" fill="#9A9A9A" text-anchor="start" letter-spacing="2.08">OPEN MEASUREMENT · PREREGISTERED · 2026</text><text x="1144.0" y="86.0" font-family="AR Sans Bold" font-size="13" fill="#9A9A9A" text-anchor="end" letter-spacing="2.08">V0.1.0-PREREGISTRATION</text><text x="50.0" y="252.0" font-family="AR Display" font-size="150" fill="#FFFFFF" text-anchor="start">artifact</text><rect x="569.3" y="208.0" width="44.0" height="11.0" fill="#FF3B2F"/><text x="623.3" y="252.0" font-family="AR Display" font-size="150" fill="#FFFFFF" text-anchor="start">rot</text><text x="56.0" y="312.0" font-family="AR Sans" font-size="24" fill="#E9E9E6" text-anchor="start">Do the code and data links announced in scientific papers still resolve,</text><text x="56.0" y="344.0" font-family="AR Sans" font-size="24" fill="#E9E9E6" text-anchor="start">and how fast do they die?</text><line x1="56.0" y1="384.0" x2="1144.0" y2="384.0" stroke="#2E2E2E" stroke-width="1"/><text x="56.0" y="424.0" font-family="AR Display" font-size="30" fill="#FFFFFF" text-anchor="start">40,000</text><text x="56.0" y="446.0" font-family="AR Sans Bold" font-size="11" fill="#9A9A9A" text-anchor="start" letter-spacing="1.76">PAPERS IN A FROZEN SAMPLE</text><line x1="328.0" y1="384.0" x2="328.0" y2="446.0" stroke="#2E2E2E" stroke-width="1"/><text x="348.0" y="424.0" font-family="AR Display" font-size="30" fill="#FFFFFF" text-anchor="start">20</text><text x="348.0" y="446.0" font-family="AR Sans Bold" font-size="11" fill="#9A9A9A" text-anchor="start" letter-spacing="1.76">STRATA · 5 YEARS × 4 FIELDS</text><line x1="600.0" y1="384.0" x2="600.0" y2="446.0" stroke="#2E2E2E" stroke-width="1"/><text x="620.0" y="424.0" font-family="AR Display" font-size="30" fill="#FFFFFF" text-anchor="start">3,988</text><text x="620.0" y="446.0" font-family="AR Sans Bold" font-size="11" fill="#9A9A9A" text-anchor="start" letter-spacing="1.76">LINKS, PROBED ON 3 DATES</text><line x1="872.0" y1="384.0" x2="872.0" y2="446.0" stroke="#2E2E2E" stroke-width="1"/><text x="892.0" y="424.0" font-family="AR Display" font-size="30" fill="#FFFFFF" text-anchor="start">98.6%</text><text x="892.0" y="446.0" font-family="AR Sans Bold" font-size="11" fill="#9A9A9A" text-anchor="start" letter-spacing="1.76">CONTROL-SET ACCURACY</text></svg>
