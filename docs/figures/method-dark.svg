<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Method: from sample to survival curve"><title>Method: from sample to survival curve</title><style>@font-face{font-family:'AR Display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AR Sans';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AR Sans Bold';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="100%" height="100%" fill="#0B0B0B"/><text x="56.0" y="64.0" font-family="AR Sans Bold" font-size="13" fill="#9A9A9A" text-anchor="start" letter-spacing="2.08">METHOD</text><text x="56.0" y="118.0" font-family="AR Display" font-size="46" fill="#FFFFFF" text-anchor="start">Six steps, each with a pass criterion.</text><line x1="56.0" y1="160.0" x2="1144.0" y2="160.0" stroke="#FFFFFF" stroke-width="2"/><text x="56.0" y="224.0" font-family="AR Display" font-size="44" fill="#FFFFFF" text-anchor="start">01</text><text x="134.0" y="216.0" font-family="AR Sans Bold" font-size="14" fill="#FFFFFF" text-anchor="start" letter-spacing="2.24">SAMPLE</text><text x="56.0" y="264.0" font-family="AR Sans" font-size="17" fill="#E9E9E6" text-anchor="start">OpenAlex, seeded and frozen</text><text x="56.0" y="290.0" font-family="AR Sans" font-size="15" fill="#9A9A9A" text-anchor="start">40,000 papers · 20 strata</text><line x1="418.7" y1="178.0" x2="418.7" y2="302.0" stroke="#2E2E2E" stroke-width="1"/><text x="446.7" y="224.0" font-family="AR Display" font-size="44" fill="#FFFFFF" text-anchor="start">02</text><text x="524.7" y="216.0" font-family="AR Sans Bold" font-size="14" fill="#FFFFFF" text-anchor="start" letter-spacing="2.24">FULL TEXT</text><text x="446.7" y="264.0" font-family="AR Sans" font-size="17" fill="#E9E9E6" text-anchor="start">Open copies only, never forced</text><text x="446.7" y="290.0" font-family="AR Sans" font-size="15" fill="#9A9A9A" text-anchor="start">repository first, publisher last</text><line x1="781.3" y1="178.0" x2="781.3" y2="302.0" stroke="#2E2E2E" stroke-width="1"/><text x="809.3" y="224.0" font-family="AR Display" font-size="44" fill="#FFFFFF" text-anchor="start">03</text><text x="887.3" y="216.0" font-family="AR Sans Bold" font-size="14" fill="#FFFFFF" text-anchor="start" letter-spacing="2.24">EXTRACT</text><text x="809.3" y="264.0" font-family="AR Sans" font-size="17" fill="#E9E9E6" text-anchor="start">Text ∪ publisher link markup</text><text x="809.3" y="290.0" font-family="AR Sans" font-size="15" fill="#9A9A9A" text-anchor="start">on-request, malformed: apart</text><text x="56.0" y="384.0" font-family="AR Display" font-size="44" fill="#FF3B2F" text-anchor="start">04</text><text x="134.0" y="376.0" font-family="AR Sans Bold" font-size="14" fill="#FFFFFF" text-anchor="start" letter-spacing="2.24">PROBE</text><text x="56.0" y="424.0" font-family="AR Sans" font-size="17" fill="#E9E9E6" text-anchor="start">APIs first, never the HTML</text><text x="56.0" y="450.0" font-family="AR Sans" font-size="15" fill="#9A9A9A" text-anchor="start">three dates spanning ≥ 10 days</text><line x1="418.7" y1="338.0" x2="418.7" y2="462.0" stroke="#2E2E2E" stroke-width="1"/><text x="446.7" y="384.0" font-family="AR Display" font-size="44" fill="#FFFFFF" text-anchor="start">05</text><text x="524.7" y="376.0" font-family="AR Sans Bold" font-size="14" fill="#FFFFFF" text-anchor="start" letter-spacing="2.24">RESOLVE</text><text x="446.7" y="424.0" font-family="AR Sans" font-size="17" fill="#E9E9E6" text-anchor="start">alive · dead · restricted · unknown</text><text x="446.7" y="450.0" font-family="AR Sans" font-size="15" fill="#9A9A9A" text-anchor="start">unknown never in a rate</text><line x1="781.3" y1="338.0" x2="781.3" y2="462.0" stroke="#2E2E2E" stroke-width="1"/><text x="809.3" y="384.0" font-family="AR Display" font-size="44" fill="#FFFFFF" text-anchor="start">06</text><text x="887.3" y="376.0" font-family="AR Sans Bold" font-size="14" fill="#FFFFFF" text-anchor="start" letter-spacing="2.24">ANALYSE</text><text x="809.3" y="424.0" font-family="AR Sans" font-size="17" fill="#E9E9E6" text-anchor="start">Isotonic survival, Wilson CIs</text><text x="809.3" y="450.0" font-family="AR Sans" font-size="15" fill="#9A9A9A" text-anchor="start">rule frozen on 21 Sept 2026</text><line x1="56.0" y1="320.0" x2="1144.0" y2="320.0" stroke="#2E2E2E" stroke-width="1"/><line x1="56.0" y1="480.0" x2="1144.0" y2="480.0" stroke="#FFFFFF" stroke-width="2"/></svg>
